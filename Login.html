<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account - Technitude Tours & Travels</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        :root {
            --primary: #087e8b;
            --primary-dark: #065a63;
            --secondary: #0b4f6c;
            --accent: #00a9c7;
            --dark: #172f3d;
            --text: #263943;
            --light: #f5f9fa;
            --white: #ffffff;
            --border: #d8e4e8;
        }

        body {
            background: var(--light);
            color: var(--text);
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* ================= DYNAMIC BACKGROUND FRAME ================= */
        #bgFrame {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            z-index: 1;
            pointer-events: none;
        }

        /* ================= MODAL ================= */
        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 48, 65, 0.55);
            backdrop-filter: blur(3px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            cursor: pointer;
        }

        .login-card {
            width: min(100%, 450px);
            max-height: 92vh;
            overflow-y: auto;
            background: var(--white);
            border-radius: 20px;
            padding: 36px 32px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
            border: 1px solid var(--border);
            text-align: center;
            position: relative;
            cursor: default;
            animation: modalFadeIn 0.3s ease-out;
            z-index: 1001;
        }

        @keyframes modalFadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .close-btn {
            position: absolute;
            top: 16px;
            right: 20px;
            background: none;
            border: none;
            color: #8fa0a8;
            font-size: 26px;
            font-weight: bold;
            line-height: 1;
            cursor: pointer;
        }

        /* ================= FORM ================= */
        .form-view {
            display: none;
        }

        .form-view.active {
            display: block;
        }

        .login-header h2 {
            font-size: 26px;
            color: var(--dark);
            font-weight: 800;
            margin-bottom: 8px;
        }

        .login-header p {
            font-size: 14px;
            color: #687a82;
            margin-bottom: 24px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: #52656e;
            margin-bottom: 7px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            height: 48px;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0 14px;
            background: var(--white);
            color: var(--dark);
            outline: none;
            font-size: 14px;
            transition: 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(8, 126, 139, 0.12);
        }

        .form-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 22px;
            font-size: 13px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #52656e;
            cursor: pointer;
        }

        .link-btn {
            color: var(--primary);
            background: none;
            border: none;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            padding: 0;
        }

        .submit-btn {
            width: 100%;
            height: 50px;
            border: none;
            border-radius: 25px;
            background: var(--primary);
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .submit-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(8, 126, 139, 0.25);
        }

        .form-footer {
            margin-top: 22px;
            font-size: 14px;
            color: #687a82;
        }

        .role-description {
            font-size: 12px;
            color: #687a82;
            margin-top: 6px;
            line-height: 1.4;
        }
    </style>
</head>

<body>

    <!-- ================= DYNAMIC BACKGROUND ================= -->
    <iframe id="bgFrame" aria-hidden="true"></iframe>

    <!-- ================= LOGIN MODAL ================= -->
    <div class="login-overlay" onclick="goToPreviousPage()">
        <div class="login-card" onclick="event.stopPropagation()">
            <button type="button" class="close-btn" onclick="goToPreviousPage()" title="Close">&times;</button>

            <!-- ================= LOGIN ================= -->
            <div id="loginView" class="form-view active">
                <div class="login-header">
                    <h2>Welcome Back</h2>
                    <p>Sign in to manage your travel bookings</p>
                </div>
                <form onsubmit="handleAuthSubmit(event)">
                    <div class="form-group">
                        <label for="loginEmail">Email or Mobile Number</label>
                        <input type="text" id="loginEmail" placeholder="Enter email or mobile" required>
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">Password</label>
                        <input type="password" id="loginPassword" placeholder="Enter password" required>
                    </div>
                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox"> Remember me
                        </label>
                        <button type="button" class="link-btn" onclick="switchView('forgotView')">Forgot Password?</button>
                    </div>
                    <button type="submit" class="submit-btn">Login</button>
                </form>
                <div class="form-footer">
                    Don't have an account?
                    <button type="button" class="link-btn" onclick="switchView('registerView')">Register Now</button>
                </div>
            </div>

            <!-- ================= REGISTER ================= -->
            <div id="registerView" class="form-view">
                <div class="login-header">
                    <h2>Create Account</h2>
                    <p>Sign up to use Technitude Tours & Travels</p>
                </div>
                <form onsubmit="handleAuthSubmit(event)">
                    <div class="form-group">
                        <label for="regName">Full Name</label>
                        <input type="text" id="regName" placeholder="Enter your full name" required>
                    </div>
                    <div class="form-group">
                        <label for="regEmail">Email Address</label>
                        <input type="email" id="regEmail" placeholder="Enter email address" required>
                    </div>
                    <div class="form-group">
                        <label for="regPhone">Mobile Number</label>
                        <input type="tel" id="regPhone" placeholder="Enter 10-digit mobile number" maxlength="10" required>
                    </div>
                    <div class="form-group">
                        <label for="regRole">Account Type</label>
                        <select id="regRole" required>
                            <option value="" disabled selected>Select account type</option>
                            <option value="CUSTOMER">Customer / User</option>
                            <option value="AGENT">Agent</option>
                            <option value="OPERATOR">Bus Operator</option>
                            <option value="SUPPORT">Support Staff</option>
                        </select>
                        <div class="role-description">Select the type of account you want to register.</div>
                    </div>
                    <div class="form-group">
                        <label for="regPassword">Create Password</label>
                        <input type="password" id="regPassword" placeholder="Create a strong password" required>
                    </div>
                    <button type="submit" class="submit-btn">Register</button>
                </form>
                <div class="form-footer">
                    Already have an account?
                    <button type="button" class="link-btn" onclick="switchView('loginView')">Login Here</button>
                </div>
            </div>

            <!-- ================= FORGOT PASSWORD ================= -->
            <div id="forgotView" class="form-view">
                <div class="login-header">
                    <h2>Reset Password</h2>
                    <p>Enter your email to receive recovery instructions</p>
                </div>
                <form onsubmit="handleAuthSubmit(event)">
                    <div class="form-group">
                        <label for="resetEmail">Registered Email</label>
                        <input type="email" id="resetEmail" placeholder="Enter your registered email" required>
                    </div>
                    <button type="submit" class="submit-btn">Send Reset Link</button>
                </form>
                <div class="form-footer">
                    Remembered password?
                    <button type="button" class="link-btn" onclick="switchView('loginView')">Back to Login</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ================= JAVASCRIPT ================= -->
    <script>
        /* ================= LOAD DYNAMIC BACKGROUND ================= */
        window.addEventListener('DOMContentLoaded', () => {
            const referrer = document.referrer;
            const bgFrame = document.getElementById('bgFrame');
            
            if (referrer && referrer.includes(window.location.hostname) && !referrer.includes('login.html')) {
                bgFrame.src = referrer;
            } else {
                bgFrame.src = 'home.html';
            }
        });

        /* ================= GO HOME ================= */
        function goToPreviousPage() {
            if (document.referrer && document.referrer.includes(window.location.hostname)) {
                window.location.href = document.referrer;
            } else {
                window.location.href = 'home.html';
            }
        }

        /* ================= SWITCH VIEW ================= */
        function switchView(viewId) {
            const views = document.querySelectorAll('.form-view');
            views.forEach(function (view) {
                view.classList.remove('active');
            });
            document.getElementById(viewId).classList.add('active');
        }

        /* ================= AUTH SUBMIT ================= */
        async function handleAuthSubmit(event) {
            event.preventDefault();
            const form = event.target;

            /* ================= LOGIN ================= */
            if (form.closest('#loginView')) {
                const emailOrMobile = document.getElementById('loginEmail').value.trim();
                const password = document.getElementById('loginPassword').value;

                if (!emailOrMobile || !password) {
                    alert('Please enter your email/mobile and password.');
                    return;
                }

                if (!validateEmailOrMobile(emailOrMobile)) {
                    alert('Enter a valid email or 10-digit mobile number.');
                    return;
                }

                try {
                    const response = await fetch('http://localhost:3000/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ emailOrMobile, password })
                    });

                    const data = await response.json();

                    if (data.success) {
                        localStorage.setItem('loggedInUser', JSON.stringify(data.user));
                        alert('Login successful!');

                        if (data.user.role === 'CUSTOMER') {
                            window.location.href = 'home.html';
                        } else if (data.user.role === 'AGENT') {
                            window.location.href = 'agent-dashboard.html';
                        } else if (data.user.role === 'OPERATOR') {
                            window.location.href = 'operator-dashboard.html';
                        } else if (data.user.role === 'SUPPORT' || data.user.role === 'ADMIN') {
                            window.location.href = 'support.html';
                        }
                    } else {
                        alert(data.message);
                    }
                } catch (error) {
                    console.error(error);
                    alert('Unable to connect to the server.');
                }
                return;
            }

            /* ================= REGISTER ================= */
            if (form.closest('#registerView')) {
                const fullName = document.getElementById('regName').value.trim();
                const email = document.getElementById('regEmail').value.trim();
                const phone = document.getElementById('regPhone').value.trim();
                const role = document.getElementById('regRole').value;
                const password = document.getElementById('regPassword').value;

                if (!fullName || !email || !phone || !role || !password) {
                    alert('Please fill in all fields.');
                    return;
                }

                if (!/^\d{10}$/.test(phone)) {
                    alert('Please enter a valid 10-digit mobile number.');
                    return;
                }

                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailRegex.test(email)) {
                    alert('Please enter a valid email address.');
                    return;
                }

                if (password.length < 6) {
                    alert('Password must contain at least 6 characters.');
                    return;
                }

                try {
                    const response = await fetch('http://localhost:3000/api/register', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ full_name: fullName, email, phone, password, role })
                    });

                    const data = await response.json();

                    if (data.success) {
                        alert('Registration successful! You can now login.');
                        form.reset();
                        switchView('loginView');
                    } else {
                        alert(data.message);
                    }
                } catch (error) {
                    console.error(error);
                    alert('Unable to connect to the server.');
                }
                return;
            }

            /* ================= FORGOT PASSWORD ================= */
            if (form.closest('#forgotView')) {
                alert('Password reset functionality will be added later.');
            }
        }

        /* ================= VALIDATE LOGIN ================= */
        function validateEmailOrMobile(input) {
            if (input.includes('@')) {
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                return emailRegex.test(input);
            }
            const mobileRegex = /^\d{10}$/;
            return mobileRegex.test(input);
        }
    </script>
</body>
</html>
