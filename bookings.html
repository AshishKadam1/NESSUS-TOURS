<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Bookings - Technitude Tours & Travels</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        :root {
            --primary: #087e8b;
            --primary-dark: #065a63;
            --secondary: #0b4f6c;
            --dark-heading: #1e293b;
            --text-muted: #64748b;
            --border-color: #d8e4e8;
            --bg-light: #f8fafc;
            --success-green: #16a34a;
            --danger-red: #dc2626;
            --white: #ffffff;
        }

        body {
            background-color: var(--bg-light);
            color: var(--dark-heading);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Standardized Header & Navbar */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 82px;
            background: rgba(255, 255, 255, 0.98);
            z-index: 1000;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.10);
        }

        .navbar {
            width: min(1250px, 94%);
            height: 82px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            cursor: pointer;
        }

        .logo-icon {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00b4d8, #087e8b);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 18px;
            border: 4px solid white;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.18);
        }

        .logo-main {
            display: block;
            line-height: 1.1;
            color: var(--secondary);
            font-size: 20px;
            font-weight: 800;
        }

        .logo-sub {
            display: block;
            line-height: 1.1;
            color: var(--primary);
            font-size: 16px;
            font-weight: 700;
        }

        .nav-links {
            list-style: none;
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .nav-links a {
            color: var(--dark-heading);
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            transition: 0.3s;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--primary);
        }

        .login-button {
            background: var(--primary);
            color: white !important;
            padding: 12px 25px;
            border-radius: 25px;
        }

        .login-button:hover {
            background: var(--primary-dark);
        }

        .user-avatar-container {
            position: relative;
            display: inline-block;
        }

        .user-avatar {
            width: 42px;
            height: 42px;
            background: var(--primary);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(0,0,0,0.15);
            transition: 0.2s;
        }

        .user-avatar:hover {
            background: var(--primary-dark);
        }

        .user-dropdown {
            display: none;
            position: absolute;
            right: 0;
            top: 50px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            border: 1px solid var(--border-color);
            width: 160px;
            padding: 8px 0;
            z-index: 1000;
        }

        .user-dropdown.show {
            display: block;
        }

        .user-dropdown button {
            width: 100%;
            text-align: left;
            background: none;
            border: none;
            padding: 10px 16px;
            font-size: 14px;
            color: var(--dark-heading);
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }

        .user-dropdown button:hover {
            background: var(--bg-light);
            color: var(--primary);
        }

        /* Main Container */
        .main-container {
            flex: 1;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            padding: 120px 20px 60px;
        }

        .page-header {
            margin-bottom: 24px;
        }

        .page-header h1 {
            font-size: 28px;
            font-weight: 800;
            color: var(--dark-heading);
            margin-bottom: 6px;
        }

        .page-header p {
            color: var(--text-muted);
            font-size: 15px;
        }

        .tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }

        .tab-btn {
            background: none;
            border: none;
            font-size: 15px;
            font-weight: 600;
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background-color: #eff6ff;
            color: var(--primary);
        }

        .booking-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .booking-card {
            background: #ffffff;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #f1f5f9;
            padding-bottom: 12px;
        }

        .bus-info {
            display: flex;
            flex-direction: column;
        }

        .bus-name {
            font-weight: 700;
            font-size: 16px;
            color: var(--dark-heading);
        }

        .booking-id {
            font-size: 13px;
            color: var(--text-muted);
        }

        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .status-confirmed { background-color: #dcfce7; color: var(--success-green); }
        .status-completed { background-color: #f1f5f9; color: var(--text-muted); }
        .status-cancelled { background-color: #fee2e2; color: var(--danger-red); }

        .route-details {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 16px;
            background-color: var(--bg-light);
            padding: 16px;
            border-radius: 12px;
        }

        .location { display: flex; flex-direction: column; }
        .location.right { text-align: right; }
        .city { font-size: 18px; font-weight: 700; color: var(--dark-heading); }
        .time { font-size: 13px; color: var(--text-muted); margin-top: 2px; }

        .duration-arrow {
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 600;
        }

        .duration-line {
            width: 80px;
            height: 2px;
            background-color: var(--border-color);
            margin: 4px 0;
            position: relative;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 8px;
        }

        .meta-info { font-size: 14px; color: var(--text-muted); }
        .meta-info span { font-weight: 700; color: var(--dark-heading); }

        .actions { display: flex; gap: 10px; }

        .btn-secondary {
            background: #ffffff;
            border: 1px solid var(--border-color);
            color: var(--dark-heading);
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }

        .btn-danger {
            background: #ffffff;
            border: 1px solid #fecaca;
            color: var(--danger-red);
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }

        .no-bookings {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <header>
        <nav class="navbar">
            <a href="home.html" class="logo">
                <span class="logo-icon">TT</span>
                <span>
                    <span class="logo-main">TECHNITUDE TOURS</span>
                    <span class="logo-sub">&amp; TRAVELS</span>
                </span>
            </a>

            <ul class="nav-links">
                <li><a href="home.html">Home</a></li>
                <li><a href="bookings.html" class="active">Manage Bookings</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="AboutUs.html">About Us</a></li>
                <li id="navLoginItem">
                    <a href="login.html" class="login-button">Login</a>
                </li>
            </ul>
        </nav>
    </header>

    <main class="main-container">
        
        <div class="page-header">
            <h1>My Bookings</h1>
            <p>View, manage, and download tickets for your upcoming trips.</p>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="filterTab('ALL', this)">All Bookings</button>
            <button class="tab-btn" onclick="filterTab('CONFIRMED', this)">Upcoming</button>
            <button class="tab-btn" onclick="filterTab('COMPLETED', this)">Completed</button>
            <button class="tab-btn" onclick="filterTab('CANCELLED', this)">Cancelled</button>
        </div>

        <div class="booking-list" id="bookingList">
            <div class="no-bookings">Loading your bookings...</div>
        </div>

    </main>

    <script>
        const loggedUser = JSON.parse(localStorage.getItem('loggedInUser') || '{}');
        let allBookings = [];
        let activeFilter = 'ALL';

        const userId = loggedUser.user_id || loggedUser.id;

        function checkAuthState() {
            const navLoginItem = document.getElementById('navLoginItem');
            if (!navLoginItem) return;

            if (userId) {
                const name = loggedUser.full_name || loggedUser.email || 'U';
                const parts = name.trim().split(' ');
                let initials = '';
                if (parts.length >= 2) {
                    initials = (parts[0][0] + parts[1][0]).toUpperCase();
                } else {
                    initials = name.substring(0, 2).toUpperCase();
                }

                navLoginItem.innerHTML = `
                    <div class="user-avatar-container">
                        <div class="user-avatar" onclick="toggleUserDropdown(event)" title="${name}">
                            ${initials}
                        </div>
                        <div class="user-dropdown" id="userDropdown">
                            ${(loggedUser.role === 'SUPPORT' || loggedUser.role === 'ADMIN') ? '<button onclick="location.href=\'support.html\'" style="color:var(--primary);">Dashboard</button>' : ''}
                            <button onclick="handleLogout()">Logout</button>
                        </div>
                    </div>
                `;
                fetchBookings();
            } else {
                document.getElementById('bookingList').innerHTML = `
                    <div class="no-bookings">
                        <h3>Please Login</h3>
                        <p style="margin-top:6px;">You must be logged in to view your bookings.</p>
                        <a href="login.html" class="login-button" style="display:inline-block; margin-top:15px; text-decoration:none;">Go to Login</a>
                    </div>
                `;
            }
        }

        function toggleUserDropdown(event) {
            event.stopPropagation();
            const dropdown = document.getElementById('userDropdown');
            if (dropdown) {
                dropdown.classList.toggle('show');
            }
        }

        function handleLogout() {
            if (confirm('Do you want to logout?')) {
                localStorage.removeItem('loggedInUser');
                window.location.href = 'home.html';
            }
        }

        window.addEventListener('click', function() {
            const dropdown = document.getElementById('userDropdown');
            if (dropdown && dropdown.classList.contains('show')) {
                dropdown.classList.remove('show');
            }
        });

        async function fetchBookings() {
            try {
                const res = await fetch('/api/user/bookings', {
                    headers: { 'x-user-id': userId }
                });
                
                if (!res.ok) {
                    throw new Error('Failed to fetch bookings from server');
                }

                allBookings = await res.json();
                renderBookings();
            } catch (err) {
                console.error('Error fetching bookings:', err);
                document.getElementById('bookingList').innerHTML = `<div class="no-bookings">Error loading bookings.</div>`;
            }
        }

        function filterTab(status, btn) {
            activeFilter = status;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderBookings();
        }

        function renderBookings() {
            const list = document.getElementById('bookingList');
            list.innerHTML = '';

            const filtered = activeFilter === 'ALL' 
                ? allBookings 
                : allBookings.filter(b => b.booking_status === activeFilter);

            if (!Array.isArray(filtered) || filtered.length === 0) {
                list.innerHTML = `<div class="no-bookings">No bookings found for this category.</div>`;
                return;
            }

            filtered.forEach(b => {
                const dateStr = b.journey_date 
                    ? new Date(b.journey_date).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }) 
                    : 'N/A';
                
                let badgeClass = 'status-confirmed';
                if (b.booking_status === 'COMPLETED') badgeClass = 'status-completed';
                if (b.booking_status === 'CANCELLED') badgeClass = 'status-cancelled';

                const currentBookingId = b.booking_id || b.id;

                list.innerHTML += `
                    <div class="booking-card">
                        <div class="card-header">
                            <div class="bus-info">
                                <span class="bus-name">${b.bus_name} (${b.bus_type || 'A/C Sleeper'})</span>
                                <span class="booking-id">PNR: ${b.booking_reference}</span>
                            </div>
                            <span class="status-badge ${badgeClass}">${b.booking_status}</span>
                        </div>

                        <div class="route-details">
                            <div class="location">
                                <span class="city">${b.from_city}</span>
                                <span class="time">${b.departure_time}</span>
                            </div>
                            <div class="duration-arrow">
                                <span>${dateStr}</span>
                                <div class="duration-line"></div>
                            </div>
                            <div class="location right">
                                <span class="city">${b.to_city}</span>
                                <span class="time">${b.arrival_time}</span>
                            </div>
                        </div>

                        <div class="card-footer">
                            <div class="meta-info">
                                Seats: <span>${b.seats_booked}</span> | Total Fare: <span>₹${b.total_amount}</span>
                            </div>
                            <div class="actions">
                                ${b.booking_status === 'CONFIRMED' ? `<button class="btn-danger" onclick="cancelBooking(${currentBookingId})">Cancel</button>` : ''}
                                <button class="btn-secondary" onclick="alert('Downloading ticket PNR: ${b.booking_reference}')">Download Ticket</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        async function cancelBooking(bookingId) {
            if (!confirm('Are you sure you want to cancel this booking?')) return;

            try {
                const res = await fetch(`/api/user/bookings/${bookingId}/cancel`, {
                    method: 'PATCH',
                    headers: { 'x-user-id': userId }
                });

                if (res.ok) {
                    alert('Booking cancelled successfully.');
                    fetchBookings();
                } else {
                    alert('Failed to cancel booking.');
                }
            } catch (err) {
                console.error('Error cancelling booking:', err);
            }
        }

        document.addEventListener("DOMContentLoaded", checkAuthState);
    </script>
</body>
</html>
